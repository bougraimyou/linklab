name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run the test suite
        run: python -m pytest -v

      - name: Build the example documentation
        run: |
          python -m linklab docs build examples/site-atlas-telecom/project.json --out /tmp/site
          test -f /tmp/site/index.html

      - name: Check the package builds
        run: python -m pip install --upgrade build && python -m build
